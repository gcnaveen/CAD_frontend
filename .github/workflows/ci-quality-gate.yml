name: CI Quality Gate

on:
  pull_request:
  push:
    branches: [main, master, develop]
  release:
    types: [published]

concurrency:
  group: fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-security:
    name: lint-test-security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Repo hygiene (size + secrets + no archives)
        run: npm run check:hygiene

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production SCA (npm audit --omit=dev)
        run: npm run audit:prod

      - name: SBOM
        run: npm run sbom

      - name: Production build
        run: npm run build

      - name: Frontend secret + dead-code scan (L-03)
        run: npm run check:secrets
        env:
          L03_REQUIRE_BUNDLE: "1"

      - name: M-05 bundle budget (initial JS gzip)
        run: npm run check:bundle

      - name: M-05 bundle analyzer report
        run: npm run build:analyze

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: |
            dist/stats.html
            docs/PERFORMANCE_M05_LAST_MEASUREMENT.json
          retention-days: 14
          if-no-files-found: warn

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E role journeys + accessibility smoke
        run: npm run test:e2e
        env:
          CI: true

      - name: Lighthouse CI (homepage)
        run: npm run lighthouse:ci
        continue-on-error: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Dedicated SCA job (optional required check alongside lint-test-security)
  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Full lockfile audit (report)
        run: npm audit --audit-level=high || true
