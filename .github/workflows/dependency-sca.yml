name: Dependency SCA (H-03)

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  sca:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: H-03 acceptance gate
        run: npm run test:h03

      - name: Generate production SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: docs/sbom/sbom-cyclonedx.json
